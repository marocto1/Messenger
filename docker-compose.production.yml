services:
  messenger-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: ./server/.env
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
