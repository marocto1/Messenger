name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.source/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete web source
        shell: bash
        run: |
          cat .source/chunk*.txt | tr -d '\n\r' | base64 -d > /tmp/web-missing.zip
          unzip -o /tmp/web-missing.zip -d .
          test -f apps/web/src/app/page.tsx
          test -f apps/web/src/app/release.css
          test -f apps/web/src/components/Settings.tsx
          test -f apps/web/src/components/calls.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://messenger-web-production.up.railway.app'
          NEXT_PUBLIC_WS_URL: 'wss://messenger-web-production.up.railway.app/ws'
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
