name: Build Marocto Messenger Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'scripts/build-desktop-web.mjs'
      - 'scripts/runtime.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows-app.yml'

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_URL: https://messenger-ennx.vercel.app
  NEXT_PUBLIC_WS_URL: wss://messenger-ennx.vercel.app/ws

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop app
        run: npm run build:desktop

      - name: Collect Windows bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          $roots = @(
            'apps/desktop/src-tauri/target/release/bundle',
            '.runtime/cargo-target/release/bundle'
          )
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -File | Where-Object {
                $_.Extension -in '.exe', '.msi'
              } | ForEach-Object {
                Copy-Item $_.FullName (Join-Path 'dist-windows' $_.Name) -Force
              }
            }
          }
          if (-not (Get-ChildItem dist-windows -File -ErrorAction SilentlyContinue)) {
            throw 'No Windows installer (.exe/.msi) was produced.'
          }
          Get-ChildItem dist-windows -File | Format-Table Name, Length

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Marocto-Messenger-Windows
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 30
