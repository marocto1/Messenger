name: Apply Postgres Adapter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-postgres-adapter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server database initialization
        shell: python
        run: |
          from pathlib import Path
          path = Path('server/index.js')
          text = path.read_text(encoding='utf-8')
          old_import = "import Database from 'better-sqlite3';"
          new_import = "import { createDatabase } from './db.js';"
          old_init = "const db = new Database(dbPath);"
          new_init = "const db = createDatabase(dbPath);"
          assert text.count(old_import) == 1, f'Expected one SQLite import, found {text.count(old_import)}'
          assert text.count(old_init) == 1, f'Expected one SQLite initialization, found {text.count(old_init)}'
          text = text.replace(old_import, new_import, 1).replace(old_init, new_init, 1)
          path.write_text(text, encoding='utf-8')
      - name: Syntax check
        run: |
          node --check server/index.js
          node --check server/db.js
          node --check server/db-postgres-worker.js
      - name: Commit patch
        run: |
          git config user.name "Marocto Messenger CI"
          git config user.email "actions@users.noreply.github.com"
          git add server/index.js
          git commit -m "Enable shared PostgreSQL database adapter"
          git push
