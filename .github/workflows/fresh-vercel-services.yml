name: Fresh Vercel Services setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh-vercel-services.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Convert Messenger to one Vercel Services project
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          # Frontend: same-origin API and WS. No old Vercel project URLs.
          config = Path('apps/web/src/lib/config.ts')
          text = config.read_text(encoding='utf-8')
          old = """const isLocalBrowser = typeof window !== 'undefined'\n  && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');\n\nconst PRODUCTION_API_URL = 'https://messenger-ennx.vercel.app';\nconst PRODUCTION_WS_URL = 'wss://messenger-ennx.vercel.app/ws';\n\nexport const API_URL = process.env.NEXT_PUBLIC_API_URL\n  || (isLocalBrowser ? browserOrigin : PRODUCTION_API_URL)\n  || 'http://localhost:4000';\nexport const WS_URL = process.env.NEXT_PUBLIC_WS_URL\n  || (isLocalBrowser ? browserWs : PRODUCTION_WS_URL)\n  || 'ws://localhost:4000/ws';\n"""
          new = """export const API_URL = process.env.NEXT_PUBLIC_API_URL\n  || (browserOrigin ? `${browserOrigin}/api` : '')\n  || 'http://localhost:4000';\nexport const WS_URL = process.env.NEXT_PUBLIC_WS_URL\n  || browserWs\n  || 'ws://localhost:4000/ws';\n"""
          if old not in text:
              raise SystemExit('Expected production URL block not found in apps/web/src/lib/config.ts')
          config.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Backend: accept /api/* public prefix while preserving existing internal routes,
          # and permit the deployment's own origin without knowing its hostname in advance.
          index = Path('server/index.js')
          src = index.read_text(encoding='utf-8')

          old_reject = "if (req.headers.origin && !ALLOWED_ORIGINS.has(req.headers.origin)) return json(res, 403, { error: 'ORIGIN_DENIED', message: 'Этот источник не разрешён.' });"
          new_reject = "if (req.headers.origin && !isAllowedOrigin(req)) return json(res, 403, { error: 'ORIGIN_DENIED', message: 'Этот источник не разрешён.' });"
          if old_reject not in src:
              raise SystemExit('HTTP origin guard not found')
          src = src.replace(old_reject, new_reject, 1)

          old_route = """    const url = new URL(req.url || '/', `http://${req.headers.host || 'localhost'}`);\n    const route = `${req.method} ${url.pathname}`;"""
          new_route = """    const url = new URL(req.url || '/', `http://${req.headers.host || 'localhost'}`);\n    if (url.pathname === '/api' || url.pathname.startsWith('/api/')) {\n      url.pathname = url.pathname.slice(4) || '/';\n    }\n    const route = `${req.method} ${url.pathname}`;"""
          if old_route not in src:
              raise SystemExit('HTTP route parser block not found')
          src = src.replace(old_route, new_route, 1)

          old_ws = "if (origin && !ALLOWED_ORIGINS.has(origin)) return socket.destroy();"
          new_ws = "if (origin && !isAllowedOrigin(req)) return socket.destroy();"
          if old_ws not in src:
              raise SystemExit('WebSocket origin guard not found')
          src = src.replace(old_ws, new_ws, 1)

          old_allowed = """function getAllowedOrigin(req) {\n  const origin = req.headers.origin;\n  return origin && ALLOWED_ORIGINS.has(origin) ? origin : DEFAULT_ALLOWED_ORIGIN;\n}"""
          new_allowed = """function isAllowedOrigin(req) {\n  const origin = req.headers.origin;\n  if (!origin) return true;\n  if (ALLOWED_ORIGINS.has(origin)) return true;\n  try {\n    const parsed = new URL(origin);\n    const forwardedHost = String(req.headers['x-forwarded-host'] || req.headers.host || '').split(',')[0].trim();\n    const forwardedProto = String(req.headers['x-forwarded-proto'] || 'https').split(',')[0].trim();\n    return Boolean(forwardedHost) && parsed.host === forwardedHost && parsed.protocol === `${forwardedProto}:`;\n  } catch {\n    return false;\n  }\n}\n\nfunction getAllowedOrigin(req) {\n  const origin = req.headers.origin;\n  return origin && isAllowedOrigin(req) ? origin : DEFAULT_ALLOWED_ORIGIN;\n}"""
          if old_allowed not in src:
              raise SystemExit('getAllowedOrigin block not found')
          src = src.replace(old_allowed, new_allowed, 1)
          index.write_text(src, encoding='utf-8')

          # Vercel container entrypoint for the backend service.
          docker = Path('server/Dockerfile').read_text(encoding='utf-8')
          Path('server/Dockerfile.vercel').write_text(docker, encoding='utf-8')

          # One public Vercel project: Next.js frontend + backend container.
          vercel = {
              "$schema": "https://openapi.vercel.sh/vercel.json",
              "services": {
                  "frontend": {
                      "root": "apps/web/",
                      "framework": "nextjs"
                  },
                  "backend": {
                      "root": "server/",
                      "runtime": "container",
                      "entrypoint": "Dockerfile.vercel"
                  }
              },
              "rewrites": [
                  {"source": "/api", "destination": {"service": "backend"}},
                  {"source": "/api/(.*)", "destination": {"service": "backend"}},
                  {"source": "/ws", "destination": {"service": "backend"}},
                  {"source": "/health", "destination": {"service": "backend"}},
                  {"source": "/(.*)", "destination": {"service": "frontend"}}
              ]
          }
          Path('vercel.json').write_text(json.dumps(vercel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/fresh-vercel-services.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Configure fresh single-project Vercel Services deploy"
          git push origin HEAD:main
