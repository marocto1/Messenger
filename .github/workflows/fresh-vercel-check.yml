name: Fresh Vercel config check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh-vercel-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync package lock with PostgreSQL dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm --workspace apps/web run build
      - run: node --check server/index.js
      - run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"
      - run: test -f server/Dockerfile.vercel
      - name: Commit lockfile and remove one-time workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/fresh-vercel-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize fresh Vercel Services deployment config"
          git push origin HEAD:main
